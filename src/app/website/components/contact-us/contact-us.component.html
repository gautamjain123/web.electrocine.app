<section class="contact-section">
  <div class="container">

    <!-- HEADER -->
    <div class="contact-header text-center">
      <h2>Get in Touch</h2>
      <p>
        Have a project in mind? Let’s discuss how we can help you with
        high-performance lighting solutions.
      </p>
    </div>

    <div class="row g-4">

      <!-- LEFT INFO -->
      <div class="col-lg-5">
        <div class="contact-info border-1 rounded-4 border">

          <h4>Contact Information</h4>

          <div class="info-item">
            <span>📍</span>
            <p>Gurgaon, India</p>
          </div>

          <div class="info-item">
            <span>📞</span>
            <p>+91 98765 43210</p>
          </div>

          <div class="info-item">
            <span>✉️</span>
            <p>infoelectrocine.com</p>
          </div>

          <div class="info-item">
            <span>🕒</span>
            <p>Mon - Sat | 9:00 AM - 7:00 PM</p>
          </div>

        </div>
      </div>

      <!-- RIGHT FORM -->
      <div class="col-lg-7">
        <div class="contact-form border-1 rounded-4 border">

          <form>

            <div class="row g-3">

              <div class="col-md-6">
                <input type="text" placeholder="Your Name" />
              </div>

              <div class="col-md-6">
                <input type="email" placeholder="Email Address" />
              </div>

              <div class="col-md-6">
                <input type="text" placeholder="Phone Number" />
              </div>

              <div class="col-md-6">
                <input type="text" placeholder="Company Name" />
              </div>

              <div class="col-12">
                <textarea rows="4" placeholder="Your Message"></textarea>
              </div>

            </div>

            <button type="submit" class="submit-btn">
              Send Message →
            </button>

          </form>

        </div>
      </div>

    </div>

  </div>
</section>
