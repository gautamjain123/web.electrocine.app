<section class="products-section">

  <!-- 🔥 PAGE HEADER -->
  <div class="products-hero">
    <div class="container text-center">
      <h1>Our Lighting Solutions</h1>
      <p>
        Explore our wide range of high-performance LED lighting products
        designed for indoor, outdoor and industrial applications.
      </p>
    </div>
  </div>

  <div class="container py-5">

    <!-- 🔥 FILTER BAR -->
    <div class="filter-bar mb-5">
      <div class="row g-3">

        <div class="col-md-4">
          <label>Category</label>
          <select class="form-select" [(ngModel)]="selectedCategory">
            <option *ngFor="let cat of categories" [value]="cat">
              {{cat}}
            </option>
          </select>
        </div>

        <div class="col-md-4">
          <label>Sub Category</label>
          <select class="form-select" [(ngModel)]="selectedSubCategory">
            <option *ngFor="let sub of subCategories" [value]="sub">
              {{sub}}
            </option>
          </select>
        </div>

      </div>
    </div>

    <!-- 🔥 DATA -->
    <div *ngFor="let cat of filteredProducts">

      <h2 class="category-title">{{cat.category}}</h2>

      <div *ngFor="let sub of cat.items" class="sub-section">

        <!-- SUB HEADER -->
        <div class="sub-header">
          <h4>{{sub.subCategory}}</h4>
        </div>

        <!-- PRODUCTS -->
        <div class="row">
          <div class="col-md-3 mb-4" *ngFor="let p of sub.products">

            <div class="product-card">

              <div class="card-body">
                <h5>{{p.name}}</h5>
                <small class="text-muted">{{p.code}}</small>

                <div class="mt-3 specs">
                  <p *ngIf="p.lumens">💡 {{p.lumens}} Lumens</p>
                  <p *ngIf="p.size">📏 {{p.size}}</p>
                  <p *ngIf="p.height">📐 {{p.height}}</p>
                </div>
              </div>

              <div class="card-footer">
                <span class="price">₹ {{p.price}}</span>
                <button>Enquire</button>
              </div>

            </div>

          </div>
        </div>

      </div>

    </div>

  </div>
</section>
